name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up locked Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint node code
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Install isolated scanner tooling without lifecycle scripts
        run: npm ci --prefix tools/community-scanner --ignore-scripts

      - name: Audit isolated scanner tooling
        run: npm audit --prefix tools/community-scanner --audit-level=high

      - name: Scan the built package with n8n's pinned scanner
        run: npm run scan:community

      - name: Review npm package inventory
        run: npm pack --dry-run --json
